server {
    listen 80;
    listen [::]:80;
    server_name blog.sagecompanion.top;

    root /var/www/blog.sagecompanion.top/current;
    index index.html;
    error_page 404 /404.html;

    # Keep Astro's trailing-slash output and return a real 404 for unknown files.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro fingerprints every file under /_astro/, so these assets can be
    # cached permanently. Public images and Pagefind keep stable filenames.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|wasm|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /rss.xml {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /sitemap-index.xml {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Add the managed HTTPS redirect/certificate block after issuing the cert
    # with certbot or your server's existing TLS automation.
}
